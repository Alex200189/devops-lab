name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: app/go.sum

      - name: go vet
        run: go vet ./...
      
      - name: go build
        run: go build ./...
   
      - name: go test
        run: go test ./... -v
